<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a3fbf"/>
      <stop offset="55%" stop-color="#0d1f8a"/>
      <stop offset="100%" stop-color="#070d3d"/>
    </radialGradient>
    <radialGradient id="eyeL" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff8800"/>
      <stop offset="30%" stop-color="#ff2200"/>
      <stop offset="70%" stop-color="#990000"/>
      <stop offset="100%" stop-color="#440000"/>
    </radialGradient>
    <radialGradient id="eyeR" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff8800"/>
      <stop offset="30%" stop-color="#ff2200"/>
      <stop offset="70%" stop-color="#990000"/>
      <stop offset="100%" stop-color="#440000"/>
    </radialGradient>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundClip">
      <rect width="400" height="400" rx="80" ry="80"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>

  <!-- Market grid lines (subtle) -->
  <g clip-path="url(#roundClip)" opacity="0.18">
    <line x1="0" y1="80"  x2="400" y2="80"  stroke="#4488ff" stroke-width="0.8"/>
    <line x1="0" y1="160" x2="400" y2="160" stroke="#4488ff" stroke-width="0.8"/>
    <line x1="0" y1="240" x2="400" y2="240" stroke="#4488ff" stroke-width="0.8"/>
    <line x1="0" y1="320" x2="400" y2="320" stroke="#4488ff" stroke-width="0.8"/>
    <line x1="80"  y1="0" x2="80"  y2="400" stroke="#4488ff" stroke-width="0.8"/>
    <line x1="160" y1="0" x2="160" y2="400" stroke="#4488ff" stroke-width="0.8"/>
    <line x1="240" y1="0" x2="240" y2="400" stroke="#4488ff" stroke-width="0.8"/>
    <line x1="320" y1="0" x2="320" y2="400" stroke="#4488ff" stroke-width="0.8"/>
  </g>

  <!-- Market numbers (tiny, atmospheric) -->
  <g clip-path="url(#roundClip)" opacity="0.2" fill="#6699ff" font-family="monospace" font-size="12">
    <text x="12"  y="55">1.4563</text>
    <text x="12"  y="100">0.2860</text>
    <text x="280" y="55">11.561</text>
    <text x="300" y="140">2.344</text>
    <text x="12"  y="300">1.2404</text>
    <text x="300" y="300">0.234</text>
  </g>

  <!-- Blue chart zigzag (bottom left) -->
  <g clip-path="url(#roundClip)" opacity="0.55">
    <polyline points="20,340 60,300 90,320 120,270 150,290" fill="none" stroke="#44aaff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="20,340 60,300 90,320 120,270 150,290" fill="none" stroke="rgba(68,170,255,0.3)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Orange arrow (top right) -->
  <g filter="url(#softGlow)" opacity="0.95">
    <line x1="245" y1="165" x2="375" y2="35" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
    <polygon points="375,35 345,45 365,62" fill="#f97316"/>
    <polygon points="375,35 345,45 365,62" fill="#fbbf24" opacity="0.6"/>
  </g>

  <!-- ── GHOST BODY ── -->
  <g filter="url(#glowStrong)">
    <!-- Left horn -->
    <path d="M148,148 L110,52 L152,118 Z"
          fill="white" opacity="0.97"/>
    <!-- Right horn -->
    <path d="M252,148 L290,52 L248,118 Z"
          fill="white" opacity="0.97"/>

    <!-- Main head -->
    <ellipse cx="200" cy="178" rx="88" ry="82" fill="white" opacity="0.98"/>

    <!-- Body -->
    <rect x="112" y="200" width="176" height="90" fill="white" opacity="0.98"/>

    <!-- Tattered ghost bottom -->
    <path d="
      M112,290
      Q112,320 130,330
      L140,310 L152,335
      L164,310 L176,338
      L188,310 L200,340
      L212,310 L224,338
      L236,310 L248,335
      L260,310 L270,330
      Q288,320 288,290
      Z"
      fill="white" opacity="0.97"/>
  </g>

  <!-- ── VISOR / EYE AREA ── -->
  <!-- Dark visor shape -->
  <path d="M134,170 Q134,152 156,148 L244,148 Q266,152 266,170 L266,188 Q266,206 244,210 L156,210 Q134,206 134,188 Z"
        fill="#0a0820" opacity="0.95"/>
  <!-- Inner visor shadow -->
  <path d="M140,172 Q140,156 160,152 L240,152 Q260,156 260,172 L260,186 Q260,202 240,206 L160,206 Q140,202 140,186 Z"
        fill="#050412" opacity="0.8"/>

  <!-- Left eye glow -->
  <g filter="url(#eyeGlow)">
    <ellipse cx="170" cy="179" rx="22" ry="16" fill="url(#eyeL)"/>
    <ellipse cx="170" cy="179" rx="12" ry="9"  fill="#ff4400" opacity="0.9"/>
    <ellipse cx="170" cy="179" rx="6"  ry="4.5" fill="#ff8800"/>
    <circle  cx="170" cy="179" r="3"   fill="#ffddaa"/>
    <!-- lens flare -->
    <ellipse cx="165" cy="175" rx="2.5" ry="1.5" fill="white" opacity="0.7" transform="rotate(-30 165 175)"/>
  </g>

  <!-- Right eye glow -->
  <g filter="url(#eyeGlow)">
    <ellipse cx="230" cy="179" rx="22" ry="16" fill="url(#eyeR)"/>
    <ellipse cx="230" cy="179" rx="12" ry="9"  fill="#ff4400" opacity="0.9"/>
    <ellipse cx="230" cy="179" rx="6"  ry="4.5" fill="#ff8800"/>
    <circle  cx="230" cy="179" r="3"   fill="#ffddaa"/>
    <!-- lens flare -->
    <ellipse cx="225" cy="175" rx="2.5" ry="1.5" fill="white" opacity="0.7" transform="rotate(-30 225 175)"/>
  </g>

  <!-- ── Beak / chest emblem ── -->
  <path d="M188,215 L200,232 L212,215 Z" fill="#0a0820" opacity="0.7"/>
  <!-- V-shaped chest marking -->
  <path d="M172,218 L200,250 L228,218" fill="none" stroke="#0a0820" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
</svg>
